name: Normalize v4.3.9 Release notes

on:
  push:
    branches: [main]
    paths: [".github/workflows/normalize-v439-notes.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Remove outdated build-folder asset references from the corrected release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v4.3.9 --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > old-notes.md
          python3 - <<'PY'
          import re
          from pathlib import Path
          body = Path('old-notes.md').read_text(encoding='utf-8')
          replacement = '''## Downloads (official-style packages)
          - `Win_x64_TeraFinder.Launcher_v4.3.9.zip` — Windows x64; only `TeraFinder.Launcher.exe`
          - `Win_x86_TeraFinder.Launcher_v4.3.9.zip` — Windows x86; only `TeraFinder.Launcher.exe`
          - `TeraFinder.Plugins_v4.3.9.zip` — PKHeX plugin; only `TeraFinder.Plugins.dll`

          '''
          body, count = re.subn(r'(?ms)^## Files\s*\n.*?(?=^### Notes)', replacement, body, count=1)
          if count != 1:
              raise SystemExit('Could not locate original legacy download list; refusing to mutate release body')
          Path('notes.md').write_text(body, encoding='utf-8')
          PY
          gh release edit v4.3.9 --repo "$GITHUB_REPOSITORY" --notes-file notes.md
