name: Validate official-style single-file release

on:
  push:
    branches: ["fix/release-packaging-upstream"]
    paths: [".github/workflows/preview-singlefile-release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      Solution_Name: TeraFinder.sln
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/checkout@v4
        with:
          repository: kwsch/PKHeX
          ref: master
          path: PKHeX
      - name: Build matching PKHeX.Core
        shell: pwsh
        run: |
          dotnet restore PKHeX/PKHeX.Core/PKHeX.Core.csproj
          dotnet build PKHeX/PKHeX.Core/PKHeX.Core.csproj -c Release --no-restore
      - name: Restore project and replace SDK PKHeX dependency
        shell: pwsh
        run: |
          dotnet restore $env:Solution_Name
          $base = Join-Path $env:USERPROFILE ".nuget\packages\pkhex.core"
          $latest = Get-ChildItem $base -Directory | Sort-Object {[version]$_.Name} -Descending | Select-Object -First 1
          $dest = Join-Path $latest.FullName "lib\net10.0\PKHeX.Core.dll"
          Copy-Item "PKHeX/PKHeX.Core/bin/Release/net10.0/PKHeX.Core.dll" $dest -Force
      - name: Build and test
        shell: pwsh
        run: |
          dotnet build $env:Solution_Name -c Release --no-restore
          dotnet test $env:Solution_Name -c Release --no-build
      - name: Publish single EXE for Windows x64
        shell: pwsh
        run: |
          dotnet publish TeraFinder.Launcher/TeraFinder.Launcher.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -o package/win-x64
      - name: Publish single EXE for Windows x86
        shell: pwsh
        run: |
          dotnet publish TeraFinder.Launcher/TeraFinder.Launcher.csproj -c Release -r win-x86 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -o package/win-x86
      - name: Make three minimal archives and verify each contains exactly one file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force package/zips | Out-Null
          $exes = @('win-x64', 'win-x86')
          foreach ($arch in $exes) {
            $exe = "package/$arch/TeraFinder.Launcher.exe"
            if (!(Test-Path $exe)) { throw "Missing $exe" }
            $all = @(Get-ChildItem -Path "package/$arch" -File)
            Write-Host "$arch publish directory has $($all.Count) files:"
            $all | Select-Object Name,Length | Format-Table -AutoSize
            Compress-Archive -Path $exe -DestinationPath "package/zips/Win_$($arch.Substring(4))_TeraFinder.Launcher_v4.3.9.zip" -CompressionLevel Optimal
          }
          $dll = "TeraFinder.Plugins/bin/Release/net10.0-windows7.0/TeraFinder.Plugins.dll"
          if (!(Test-Path $dll)) { throw "Missing $dll" }
          Compress-Archive -Path $dll -DestinationPath "package/zips/TeraFinder.Plugins_v4.3.9.zip" -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression
          foreach ($zip in Get-ChildItem package/zips/*.zip) {
            $zf=[System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
            try {
              $entries=@($zf.Entries)
              if ($entries.Count -ne 1) { throw "$($zip.Name) has $($entries.Count) entries, expected 1" }
              Write-Host "VERIFIED $($zip.Name): 1 file: $($entries[0].FullName), compressed bytes: $($zip.Length)"
            } finally { $zf.Dispose() }
          }
      - name: Upload minimal release ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: TeraFinder.OfficialStylePackages
          path: package/zips/*.zip
          if-no-files-found: error
